name: Build Desktop App

# Builds SmartFileOrganizer for both macOS and Windows automatically.
# Runs on every push to main, or manually from the Actions tab.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SmartFileOrganizer-Windows
            build_path: dist/SmartFileOrganizer.exe
            # Windows: --onefile is fine and standard for a single .exe
            pyinstaller_args: --onefile --windowed --noconfirm --name "SmartFileOrganizer" --add-data "config.json;." gui.py
          - os: macos-latest
            artifact_name: SmartFileOrganizer-macOS
            build_path: dist/SmartFileOrganizer.app
            # macOS: --onefile + a .app bundle is deprecated by PyInstaller itself.
            # Omitting --onefile uses the recommended onedir mode instead.
            pyinstaller_args: --windowed --noconfirm --name "SmartFileOrganizer" --add-data "config.json:." gui.py

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build app
        run: pyinstaller ${{ matrix.pyinstaller_args }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.build_path }}